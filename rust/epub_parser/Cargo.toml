[package]
name = "epub_parser"
version = "0.1.0"
edition = "2021"

[dependencies]
rbook = "0.6"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
percent-encoding = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
