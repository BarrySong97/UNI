<!DOCTYPE html>

<title>Immerse Icon Preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #F2F2F2;
    font-family: -apple-system, sans-serif;
    color: #0E0E0E;
    gap: 48px;
  }
  .preview-row {
    display: flex;
    align-items: end;
    gap: 40px;
  }
  .preview-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .preview-item span {
    font-size: 13px;
    opacity: 0.5;
  }
  .icon-wrapper {
    border-radius: 22.37%;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  .icon-wrapper svg {
    display: block;
  }
</style>
</head>

<div class="preview-row">
  <!-- 256px -->
  <div class="preview-item">
    <div class="icon-wrapper" style="width:256px;height:256px;">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="cs1" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#5C4A3A" flood-opacity="0.15"/>
          </filter>
        </defs>
        <rect width="1024" height="1024" fill="#E8E4DF"/>
        <rect x="192" y="220" width="640" height="300" rx="28" fill="#FAF9F7" filter="url(#cs1)"/>
        <polygon points="472,520 552,520 512,556" fill="#FAF9F7"/>
        <text x="248" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#1A1A1A">Immersed</text>
        <text x="248" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#8B7355">/ɪˈmɜːrst/</text>
        <rect x="248" y="410" width="540" height="20" rx="10" fill="#5C4A3A" opacity="0.18"/>
        <rect x="248" y="446" width="400" height="20" rx="10" fill="#5C4A3A" opacity="0.12"/>
        <rect x="248" y="482" width="470" height="20" rx="10" fill="#5C4A3A" opacity="0.07"/>
        <text x="270" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#5C4A3A" opacity="0.35">Get</text>
        <rect x="390" y="636" width="380" height="62" rx="10" fill="#8B7355" opacity="0.15"/>
        <text x="580" y="684" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#1A1A1A">Immersed</text>
